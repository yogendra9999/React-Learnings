name: Deploy React Tasks to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build all React projects
        shell: bash
        run: |
          set -e

          rm -rf site
          mkdir -p site

          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>React Learnings</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 40px;
                background: #f5f7fb;
              }
              h1 {
                text-align: center;
                margin-bottom: 10px;
              }
              .subtitle {
                text-align: center;
                color: #666;
                margin-bottom: 35px;
              }
              h2 {
                margin-top: 30px;
              }
              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 15px;
              }
              a {
                display: block;
                padding: 18px;
                background: white;
                border-radius: 10px;
                text-decoration: none;
                color: #2563eb;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08);
              }
              a:hover {
                transform: translateY(-2px);
              }
            </style>
          </head>
          <body>
            <h1>React Learning Tasks</h1>
            <p class="subtitle">Components, Props and States</p>
          EOF

          for category in components props states; do

            if [ ! -d "$category" ]; then
              continue
            fi

            echo "<h2>${category^}</h2>" >> site/index.html
            echo "<div class=\"grid\">" >> site/index.html

            find "$category" -name package.json -not -path "*/node_modules/*" -print0 |
            while IFS= read -r -d '' package_file; do

              project_dir="$(dirname "$package_file")"

              echo "Building: $project_dir"

              cd "$project_dir"

              npm install

              base_path="/React-Learnings/${project_dir}/"

              npx vite build --base="$base_path"

              cd - > /dev/null

              mkdir -p "site/$project_dir"

              cp -R "$project_dir/dist/." "site/$project_dir/"

              project_name="$(basename "$project_dir")"

              echo "<a href=\"./${project_dir}/\">${project_name}</a>" >> site/index.html

            done

            echo "</div>" >> site/index.html

          done

          cat >> site/index.html <<'EOF'
          </body>
          </html>
          EOF

          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4